name: Release

# Push a tag like v0.1.0 (matching package.json "version") to publish to npm
# and create a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm Trusted Publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build release package
        run: bun run release:build

      - name: Publish to npm
        working-directory: release
        # Idempotent: a published name@version can never be reused, so if a
        # previous run already published it, skip and let the release step retry.
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish."
          else
            npm publish --provenance --access public
          fi
        env:
          # Optional when npm Trusted Publishing is configured for this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        # Idempotent: re-running uploads (overwrites) the asset on an existing release.
        run: |
          cd release && npm pack && cd ..
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/omp-ui-*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/omp-ui-*.tgz \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
